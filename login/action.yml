# Login action is moved to azure/login repository, update your workflows to use the new action.
name: 'Login Azure'
description: 'Login Azure wraps the az login, allowing for Azure actions to log into Azure'
inputs: 
  creds:
    description: 'Paste output of `az ad sp create-for-rbac` as value of secret variable: AZURE_CREDENTIALS'
    deprecationMessage: 'This legacy Login action is deprecated. Update your workflows to use the maintained azure/login@v2 action.'
    required: true
branding:
  icon: 'login.svg'
  color: 'blue'
runs:
  using: 'node24'
  main: 'dist/index.js'
